<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PyRun - Python Editor</title>

<!-- Pyodide -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#0d1117;
    color:#e6edf3;
    font-family:Arial, sans-serif;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:55px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.logo{
    font-size:21px;
    font-weight:bold;
    color:#58a6ff;
}

.status{
    font-size:13px;
    color:#8b949e;
}

/* TOOLBAR */

.toolbar{
    min-height:50px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    flex-wrap:wrap;
}

button{
    background:#21262d;
    color:#e6edf3;
    border:1px solid #30363d;
    border-radius:6px;
    padding:8px 14px;
    cursor:pointer;
    font-size:13px;
}

button:hover{
    background:#30363d;
}

button.primary{
    background:#238636;
    border-color:#2ea043;
}

button.primary:hover{
    background:#2ea043;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* EDITOR */

.editor-area{
    flex:1;
    display:flex;
    min-height:0;
}

.line-numbers{
    width:45px;
    background:#0d1117;
    color:#6e7681;
    padding:15px 8px;
    text-align:right;
    font-family:monospace;
    font-size:14px;
    line-height:22px;
    overflow:hidden;
    border-right:1px solid #21262d;
    user-select:none;
}

#editor{
    flex:1;
    resize:none;
    outline:none;
    border:none;
    background:#0d1117;
    color:#e6edf3;
    padding:15px;
    font-family:monospace;
    font-size:14px;
    line-height:22px;
    tab-size:4;
    overflow:auto;
}

/* BOTTOM PANEL */
